# lefthook.yml - tupynambalucas-dev/org-core
# Authoritative Git Hook Configuration (Evil Martians Lefthook)

pre-commit:
  parallel: true
  commands:
    mani-check:
      glob: "mani.yaml"
      run: mani check
    yaml-lint:
      glob: "*.{yml,yaml}"
      run: npx prettier --check {staged_files}

commit-msg:
  commands:
    commitlint:
      run: npx --no -- commitlint --edit {1}

pre-push:
  commands:
    prevent-main-push:
      run: |
        BRANCH=$(git branch --show-current)
        if [ "$BRANCH" = "main" ]; then
          echo "[ERROR] Direct push to main branch is strictly blocked."
          exit 1
        fi
